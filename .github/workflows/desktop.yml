name: Desktop

# Builds the desktop installers. Windows and Linux build on every push;
# macOS (slower, pricier runners) only when started with "Run workflow".
on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["windows-latest","ubuntu-latest","macos-latest"]' || '["windows-latest","ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:desktop
      # Builds the targets configured in package.json for the runner's OS.
      - run: npx electron-builder --publish never
        env:
          # No code-signing certificate: build unsigned installers.
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: MusicCreator-${{ runner.os }}
          path: |
            release/*.exe
            release/*.AppImage
            release/*.dmg
          if-no-files-found: error

      # Microsoft Store package. The Store signs it with Microsoft's certificate,
      # so installs from the Store show no SmartScreen warning. The identity must
      # be the one Partner Center assigns to the app; set it in the repository
      # variables MS_STORE_IDENTITY_NAME, MS_STORE_PUBLISHER and
      # MS_STORE_PUBLISHER_DISPLAY_NAME (until then a placeholder identity is
      # used, fine for testing the build but not accepted by the Store).
      - name: Build Microsoft Store package
        if: runner.os == 'Windows'
        shell: bash
        env:
          IDENTITY_NAME: ${{ vars.MS_STORE_IDENTITY_NAME }}
          PUBLISHER: ${{ vars.MS_STORE_PUBLISHER }}
          PUBLISHER_DISPLAY_NAME: ${{ vars.MS_STORE_PUBLISHER_DISPLAY_NAME }}
        run: |
          args=()
          if [ -n "$IDENTITY_NAME" ]; then args+=("-c.appx.identityName=$IDENTITY_NAME"); fi
          if [ -n "$PUBLISHER" ]; then args+=("-c.appx.publisher=$PUBLISHER"); fi
          if [ -n "$PUBLISHER_DISPLAY_NAME" ]; then args+=("-c.appx.publisherDisplayName=$PUBLISHER_DISPLAY_NAME"); fi
          npx electron-builder --win appx --publish never "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: MusicCreator-MicrosoftStore
          path: release/*.appx
          if-no-files-found: error
